<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Print Qty Calculator</title>
<style>
:root{--bg:#f6f5f2;--card:#fff;--ink:#1b1b1b;--mute:#6b6b66;--line:#e2e0da;--acc:#0f766e;--accbg:#d9f0ed;--piece:#0f766e;--rot:#d97706;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121413;--card:#1c1f1e;--ink:#f0efea;--mute:#9a9a92;--line:#2c302e;--acc:#2dd4bf;--accbg:#12332f;--piece:#2dd4bf;--rot:#fbbf24}}
:root[data-theme="dark"]{--bg:#121413;--card:#1c1f1e;--ink:#f0efea;--mute:#9a9a92;--line:#2c302e;--acc:#2dd4bf;--accbg:#12332f;--piece:#2dd4bf;--rot:#fbbf24}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1000px;margin:0 auto;padding:18px 14px 40px}
h1{font-size:22px;margin:0 0 2px}
.sub{color:var(--mute);margin:0 0 16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:760px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
h2{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin:0 0 10px}
label{display:block;font-size:12px;color:var(--mute);margin-bottom:3px}
input,select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
input:focus,select:focus{outline:2px solid var(--acc);outline-offset:-1px}
.row{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:10px}
.row3{grid-template-columns:repeat(3,1fr)}
.srow{display:grid;grid-template-columns:1.4fr 1fr 1fr auto;gap:6px;margin-bottom:6px;align-items:center}
.x{background:none;border:0;color:var(--mute);font-size:18px;cursor:pointer;padding:4px 8px}
.btn{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:8px 12px;font:inherit;cursor:pointer}
.btn:hover{border-color:var(--acc)}
.wide{grid-column:1/-1}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute)}
tbody tr{cursor:pointer}
tbody tr.sel{background:var(--accbg)}
.big{font-weight:700;font-size:17px}
.best{display:inline-block;background:var(--acc);color:var(--bg);font-size:10px;padding:1px 6px;border-radius:99px;margin-left:6px;vertical-align:middle}
.leg{display:flex;gap:14px;font-size:12px;color:var(--mute);margin:8px 0 0;flex-wrap:wrap}
.leg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
svg{width:100%;height:auto;max-height:420px;display:block}
.note{color:var(--mute);font-size:12px;margin-top:8px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Print Qty Calculator</h1>
  <p class="sub">Enter your design size. See how many pieces fit on each stock size.</p>

  <div class="grid">
    <div class="card">
      <h2>Design &amp; settings</h2>
      <div class="row">
        <div><label>Design width</label><input id="dw" type="number" step="any" min="0" value="9"></div>
        <div><label>Design height</label><input id="dh" type="number" step="any" min="0" value="5.5"></div>
      </div>
      <div class="row row3">
        <div><label>Unit</label><select id="unit"><option value="1">mm</option><option value="10" selected>cm</option><option value="25.4">inch</option></select></div>
        <div><label>Gap between</label><input id="gap" type="number" step="any" min="0" value="0.2"></div>
        <div><label>Sheet margin</label><input id="mar" type="number" step="any" min="0" value="0.5"></div>
      </div>
      <div class="row">
        <div><label>Qty needed (optional)</label><input id="need" type="number" min="0" placeholder="e.g. 1000"></div>
        <div><label>Allow rotation</label><select id="rot"><option value="1">Yes (best fit)</option><option value="0">No (fixed direction)</option></select></div>
      </div>
    </div>

    <div class="card">
      <h2>Ready-made stock sizes</h2>
      <div id="stocks"></div>
      <button class="btn" id="add">+ Add stock size</button>
    </div>

    <div class="card wide">
      <h2>Results</h2>
      <div class="tw"><table>
        <thead><tr><th>Stock</th><th>Size</th><th>Pcs / sheet</th><th>Used</th><th id="nh">Sheets needed</th></tr></thead>
        <tbody id="res"></tbody>
      </table></div>
      <div class="note">Tap a row to preview the layout. Used % = design area ÷ full sheet area.</div>
    </div>

    <div class="card wide">
      <h2 id="ptitle">Layout preview</h2>
      <div id="prev"></div>
      <div class="leg"><span><i style="background:var(--piece)"></i>Normal</span><span><i style="background:var(--rot)"></i>Rotated 90°</span><span><i style="border:1px dashed var(--mute)"></i>Margin</span></div>
    </div>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
let stocks=[{n:"21×15 cm",w:210,h:150},{n:"25×23 cm",w:250,h:230},{n:"45×25 cm",w:450,h:250},{n:"45×32 cm",w:450,h:320},{n:"48×23 cm",w:480,h:230},{n:"23×20 cm",w:230,h:200},{n:"20×14 cm",w:200,h:140},{n:"35×25 cm",w:350,h:250},{n:"35×33 cm",w:350,h:330},{n:"33×23 cm",w:330,h:230},{n:"48×33 cm",w:480,h:330},{n:"50×35 cm",w:500,h:350},{n:"50×23 cm",w:500,h:230},{n:"100×70 cm",w:1000,h:700},{n:"90×64 cm",w:900,h:640},{n:"70×50 cm",w:700,h:500}];
try{const s=JSON.parse(localStorage.getItem("pqc_stocks_v2")||"null");if(Array.isArray(s)&&s.length)stocks=s}catch(e){}
let sel=0,lastUnit=10;
const save=()=>{try{localStorage.setItem("pqc_stocks_v2",JSON.stringify(stocks))}catch(e){}};
const u=()=>parseFloat($("unit").value);
const f=v=>+(v/u()).toFixed(3);       // mm -> display
const t=v=>(parseFloat(v)||0)*u();    // display -> mm

// place pieces of size w×h in region; returns rects
function place(x0,y0,W,H,w,h,g,r){
  const o=[];if(w<=0||h<=0||W<w||H<h)return o;
  const nx=Math.floor((W+g)/(w+g)),ny=Math.floor((H+g)/(h+g));
  for(let j=0;j<ny;j++)for(let i=0;i<nx;i++)o.push({x:x0+i*(w+g),y:y0+j*(h+g),w,h,r});
  return o;
}
function extent(a){return a.length?{w:Math.max(...a.map(p=>p.x+p.w)),h:Math.max(...a.map(p=>p.y+p.h))}:{w:0,h:0}}

function best(W,H,w,h,g,allowRot){
  let top=[];
  const dirs=allowRot?[[w,h,false],[h,w,true]]:[[w,h,false]];
  for(const [a,b,r] of dirs){
    const m=place(0,0,W,H,a,b,g,r);
    if(!m.length)continue;
    const e=extent(m),c=[m];
    if(allowRot){
      const rr=!r;
      c.push(m.concat(place(e.w+g,0,W-e.w-g,H,b,a,g,rr),place(0,e.h+g,e.w,H-e.h-g,b,a,g,rr)));
      c.push(m.concat(place(e.w+g,0,W-e.w-g,e.h,b,a,g,rr),place(0,e.h+g,W,H-e.h-g,b,a,g,rr)));
    }
    for(const x of c)if(x.length>top.length)top=x;
  }
  return top;
}

function renderStocks(){
  $("stocks").innerHTML=stocks.map((s,i)=>`<div class="srow">
    <input data-i="${i}" data-k="n" value="${s.n.replace(/"/g,"&quot;")}" placeholder="Name">
    <input data-i="${i}" data-k="w" type="number" step="any" value="${f(s.w)}" placeholder="W">
    <input data-i="${i}" data-k="h" type="number" step="any" value="${f(s.h)}" placeholder="H">
    <button class="x" data-del="${i}" title="Remove">×</button></div>`).join("");
}

function calc(){
  const w=t($("dw").value),h=t($("dh").value),g=t($("gap").value),m=t($("mar").value);
  const rot=$("rot").value==="1",need=parseInt($("need").value)||0;
  $("nh").style.display=need?"":"none";
  const rows=stocks.map((s,i)=>{
    const W=s.w-2*m,H=s.h-2*m;
    const L=(W>0&&H>0&&w>0&&h>0)?best(W,H,w,h,g,rot):[];
    const n=L.length,used=s.w*s.h?n*w*h/(s.w*s.h)*100:0;
    return{i,s,L,n,used,W,H,sheets:need&&n?Math.ceil(need/n):null};
  });
  const mx=Math.max(0,...rows.map(r=>r.n));
  if(sel>=rows.length)sel=0;
  const un=$("unit").selectedOptions[0].text;
  $("res").innerHTML=rows.map(r=>`<tr data-s="${r.i}" class="${r.i===sel?"sel":""}">
    <td>${r.s.n||"Stock "+(r.i+1)}${r.n&&r.n===mx?'<span class="best">BEST</span>':""}</td>
    <td>${f(r.s.w)} × ${f(r.s.h)} ${un}</td>
    <td class="big">${r.n}</td><td>${r.used.toFixed(1)}%</td>
    ${need?`<td>${r.sheets??"—"}</td>`:""}</tr>`).join("")||`<tr><td colspan="5">Add a stock size.</td></tr>`;
  draw(rows[sel],m);
}

function draw(r,m){
  if(!r){$("prev").innerHTML="";return}
  const S=r.s;
  $("ptitle").textContent=`Layout preview — ${S.n||"Stock"}: ${r.n} pcs`;
  const fs=Math.max(S.w,S.h)/28;
  const rects=r.L.map(p=>`<rect x="${p.x+m}" y="${p.y+m}" width="${p.w}" height="${p.h}" fill="${p.r?"var(--rot)":"var(--piece)"}" fill-opacity=".75" stroke="var(--card)" stroke-width="${fs/12}"/>`).join("");
  const labels=r.L.length<=150?"":"";
  $("prev").innerHTML=`<svg viewBox="-${fs} -${fs} ${S.w+2*fs} ${S.h+2*fs}" role="img" aria-label="Layout preview">
    <rect x="0" y="0" width="${S.w}" height="${S.h}" fill="var(--bg)" stroke="var(--mute)" stroke-width="${fs/14}"/>
    <rect x="${m}" y="${m}" width="${Math.max(0,S.w-2*m)}" height="${Math.max(0,S.h-2*m)}" fill="none" stroke="var(--mute)" stroke-dasharray="${fs/3} ${fs/3}" stroke-width="${fs/20}"/>
    ${rects}${labels}</svg>`;
}

["dw","dh","gap","mar","need","rot"].forEach(id=>$(id).addEventListener("input",calc));
$("unit").addEventListener("change",()=>{
  const nu=u(),k=lastUnit/nu;
  ["dw","dh","gap","mar"].forEach(id=>{const v=parseFloat($(id).value);if(!isNaN(v))$(id).value=+(v*k).toFixed(3)});
  lastUnit=nu;renderStocks();calc();
});
$("stocks").addEventListener("input",e=>{
  const d=e.target.dataset;if(d.i===undefined)return;
  const s=stocks[d.i];s[d.k]=d.k==="n"?e.target.value:t(e.target.value);save();calc();
});
$("stocks").addEventListener("click",e=>{
  const i=e.target.dataset.del;if(i===undefined)return;
  stocks.splice(+i,1);save();renderStocks();calc();
});
$("add").addEventListener("click",()=>{stocks.push({n:"New size",w:500,h:700});save();renderStocks();calc()});
$("res").addEventListener("click",e=>{
  const tr=e.target.closest("tr[data-s]");if(!tr)return;sel=+tr.dataset.s;calc();
});
renderStocks();calc();
</script>
</body>
</html>
